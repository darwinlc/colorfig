<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Terminal station</title>
</head>
<body>
<script>
/* ============================================================
   Colorfigures core: projection, shapes, shading, ink, labels, page shell.
   A figure page includes this file (scripts/build.py inlines it), then calls mountFigure({...}).
   See SKILL.md for the drawing contract and conventions.
   One fixed view (front-left-top) and one fixed light (from above, behind the viewer's right shoulder: the front is lit,
   the left side is in shade, and cast shadows fall toward the lower left of the screen).
   ============================================================ */

/* ---------- palettes ---------- */
const PALS = {
  mustard: { l:'#f4b829', m:'#d49c1f', d:'#4e4a18' },
  tomato:  { l:'#ef6a4c', m:'#cf5038', d:'#4a2219' },
  mint:    { l:'#93d3b0', m:'#71b693', d:'#1f4034' },
  cobalt:  { l:'#76a0e2', m:'#5a82c6', d:'#1c2948' },
  blush:   { l:'#f3a6bb', m:'#d8869c', d:'#4b2430' },
};
const METAL   = { l:'#eef0f0', m:'#c6ccce', d:'#8f989b' };
const CLEAR   = { l:'#e4f2f4', m:'#c4dfe4', d:'#97b9c0' };
const CERAMIC = { l:'#fbfaf3', m:'#e3e0d2', d:'#bdb8a6' };
const DARK    = { l:'#55504a', m:'#3d3935', d:'#272421' };
const INK = '#231e16';
const SHADOW = '#41538f';

/* ---------- projection (x = depth toward viewer-right, y = toward viewer-left, z = up) ---------- */
const C = Math.cos(Math.PI/6), S = Math.sin(Math.PI/6);
let OX = 0, OY = 0;
/* VIEW turns the object in 90° steps about a vertical axis through its centre (RC):
   0 = front (+x) and left (+y) faces toward the viewer, 1 = turned once (the +y side becomes the front)…
   Figures keep modelling in their own coordinates; P / Dv / vis / tone / depthOf all apply the turn. */
let VIEW = 0, RC = [0, 0];
const VIEW_NAMES = ['front', 'left side', 'back', 'right side'];
const TURNS = [0, 2];                 // the views the UI offers: front and back (figures still draw correctly in all four)
const rotV = ([x,y,z]) => { switch (VIEW & 3){ case 1: return [y,-x,z]; case 2: return [-x,-y,z]; case 3: return [-y,x,z]; default: return [x,y,z]; } };
const rotXY = (x,y) => { const r = rotV([x-RC[0], y-RC[1], 0]); return [r[0]+RC[0], r[1]+RC[1]]; };
const P0 = (x,y,z) => [(x-y)*C + OX, (x+y)*S - z + OY];                       // raw iso, no turn
const P  = (x,y,z) => { const [a,b] = rotXY(x,y); return [(a-b)*C + OX, (a+b)*S - z + OY]; };
const Dv = (x,y,z) => { const [a,b,c] = rotV([x,y,z]); return [(a-b)*C, (a+b)*S - c]; };
// distance toward the viewer in the current view: draw parts with smaller depth first
const depthOf = p => { const [a,b] = rotXY(p[0],p[1]); return a + b + p[2]; };
// sort [{at:[x,y,z], svg}] back-to-front for the current view and join
const byDepth = parts => parts.filter(Boolean).sort((p,q) => depthOf(p.at) - depthOf(q.at)).map(p => p.svg).join('');
const f  = v => v.toFixed(1);
const pd = (pts, close=true) => 'M' + pts.map(p => { const q = P(p[0],p[1],p[2]); return f(q[0])+' '+f(q[1]); }).join('L') + (close ? 'Z' : '');
const sp = pts => 'M' + pts.map(q => f(q[0])+' '+f(q[1])).join('L') + 'Z';

/* ---------- 2D shapes in a plane's (u,v) coords (v up), mapped to 3D by a plane ---------- */
const arcUV  = (cu,cv,r,a0,a1,n=7) => { const o=[]; for (let i=0;i<=n;i++){ const a=(a0+(a1-a0)*i/n)*Math.PI/180; o.push([cu+r*Math.cos(a), cv+r*Math.sin(a)]); } return o; };
const rrUV   = (u0,v0,u1,v1,r,n=7) => r <= 0 ? rectUV(u0,v0,u1,v1) : [...arcUV(u1-r,v0+r,r,-90,0,n), ...arcUV(u1-r,v1-r,r,0,90,n), ...arcUV(u0+r,v1-r,r,90,180,n), ...arcUV(u0+r,v0+r,r,180,270,n)];
const rectUV = (u0,v0,u1,v1) => [[u0,v0],[u1,v0],[u1,v1],[u0,v1]];
const ellUV  = (cu,cv,ru,rv,n=24) => Array.from({length:n}, (_,i) => { const a=i/n*2*Math.PI; return [cu+ru*Math.cos(a), cv+rv*Math.sin(a)]; });
const PX = x => ([u,v]) => [x,u,v];      // front-facing plane x = const   (u = y, v = z)
const PY = y => ([u,v]) => [u,y,v];      // side plane y = const           (u = x, v = z)
const PZ = z => ([u,v]) => [u,v,z];      // horizontal plane z = const     (u = x, v = y)
const on = (plane, uv) => uv.map(plane);

/* ---------- vectors + shading ---------- */
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]], dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]];
const norm=a=>{ const l=Math.hypot(...a)||1; return a.map(v=>v/l); };
const avg=ps=>ps.reduce((s,p)=>[s[0]+p[0]/ps.length,s[1]+p[1]/ps.length,s[2]+p[2]/ps.length],[0,0,0]);
const vis = n => { const r = rotV(n); return r[0]+r[1]+r[2] > 1e-6; };   // viewer looks from (+1,+1,+1) after the turn
const facing = vis;                                                       // readable alias: is this face toward the viewer?
const SHADOW_K = 0.85, AZ_MIN = 20, AZ_MAX = 160;
// cast shadows are drawn shorter than the shading light implies (0.45 × height instead of 0.85 ×): long shadows of tall
// parts on thin supports (a lamp shade, a fan head) land far from the object and read as separate blobs
const SHADOW_LEN = 0.45;
let L = [0,0,1], SH = [0,0];
function setLight(deg){ const a=deg*Math.PI/180; SH=[SHADOW_K*Math.cos(a), SHADOW_K*Math.sin(a)]; L=norm([-SH[0],-SH[1],1]); }
const LIN = norm([.6,.2,1]);                       // fixed light for interiors / small props
const tone  = (n,m) => { const d=dot(rotV(n),L);   return d>-.15 ? m.l : d>-.45 ? m.m : m.d; };   // exterior, follows the sun
const toneI = (n,m) => { const d=dot(rotV(n),LIN); return d>.6 ? m.l : d>.05 ? m.m : m.d; };      // interior / props
const mix = (a,b,t) => '#' + [1,3,5].map(i => Math.round(parseInt(a.substr(i,2),16)*(1-t) + parseInt(b.substr(i,2),16)*t).toString(16).padStart(2,'0')).join('');
const matOf = hex => ({ l:hex, m:mix(hex,'#000000',.16), d:mix(hex,'#000000',.42) });
const ease = t => t<.5 ? 2*t*t : 1-Math.pow(-2*t+2,2)/2;

/* ---------- drawing primitives (all return SVG strings) ---------- */
const ink   = (d,w=1.0) => `<path d="${d}" fill="none" stroke="${INK}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"/>`;
const fill  = (d,c,extra='') => `<path d="${d}" fill="${c}" ${extra}/>`;
const face  = (d,c) => `<path d="${d}" fill="${c}" stroke="${c}" stroke-width=".7" stroke-linejoin="round"/>`;
const shape = (pts,c,w=.9) => fill(pd(pts),c) + (w ? ink(pd(pts),w) : '');
const line  = (pts,w=.9) => ink(pd(pts,false),w);
// Loft between two rings of equal length (closed). colour(n) picks each strip's fill; flip = seen from inside.
function loft(A, B, colour, flip=false){
  const n=A.length, cen=avg(A.concat(B)); let s='';
  for (let i=0;i<n;i++){
    const a0=A[i], a1=A[(i+1)%n], b1=B[(i+1)%n], b0=B[i];
    let nr = norm(cross(sub(a1,a0), sub(b0,a0)));
    if (!isFinite(nr[0])) continue;
    if (dot(nr, sub(avg([a0,a1,b1,b0]), cen)) < 0) nr = nr.map(v=>-v);
    if (flip) nr = nr.map(v=>-v);
    if (vis(nr)) s += face(pd([a0,a1,b1,b0]), colour(nr));
  }
  return s;
}
function hull(pts){
  pts = pts.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
  const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]); const lo=[], up=[];
  for (const p of pts){ while(lo.length>=2 && cr(lo[lo.length-2],lo[lo.length-1],p)<=0) lo.pop(); lo.push(p); }
  for (const p of pts.reverse()){ while(up.length>=2 && cr(up[up.length-2],up[up.length-1],p)<=0) up.pop(); up.push(p); }
  lo.pop(); up.pop(); return lo.concat(up);
}
// Silhouette ink, weighted by how thick the part is on screen (like a hand inker): the w you pass is the most it gets.
// Thickness = 2 × area / perimeter of the outline (a rod's diameter, about half a box's width), as a share of the
// frame width. A long thin rod, a handle or a knob stays light (~1–1.5); a grinder, kettle or machine body gets the
// heavy ~2.4–2.8. Thin parts stay thin and parts keep air between them.
const hullInk = (pts3, w=1.4) => { const h = hull(pts3.map(p=>P(...p))); let a = 0, per = 0;
  for (let i = 0; i < h.length; i++){ const p = h[i], q = h[(i+1) % h.length]; a += p[0]*q[1] - q[0]*p[1]; per += Math.hypot(q[0]-p[0], q[1]-p[1]); }
  const thick = per ? Math.abs(a) / per / (INK_K * INK_REF_VB) : 0;
  return ink(sp(h), Math.min(w, .9 + 20*thick)); };
// Axis-aligned box: three visible faces, shaded, each outlined. shade = tone (sunlit) or toneI (interior).
function box(x0,y0,z0,x1,y1,z1,m,shade=toneI,w=.9){
  // all six faces, drawn only when they face the viewer (sides first, then top) — correct in every VIEW
  const F = [
    [[0,1,0],  [[x0,y1,z0],[x1,y1,z0],[x1,y1,z1],[x0,y1,z1]]],
    [[1,0,0],  [[x1,y0,z0],[x1,y1,z0],[x1,y1,z1],[x1,y0,z1]]],
    [[0,-1,0], [[x0,y0,z0],[x1,y0,z0],[x1,y0,z1],[x0,y0,z1]]],
    [[-1,0,0], [[x0,y0,z0],[x0,y1,z0],[x0,y1,z1],[x0,y0,z1]]],
    [[0,0,1],  [[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]]] ];
  return F.filter(([n]) => vis(n)).map(([n,q]) => shape(q, shade(n,m), w)).join('');
}
// Rounded-profile extrusion: profile (u=y, v=z) swept along x from x0 to x1. Body of most machines.
function extrude(profileUV, x0, x1, m, shade=tone){ return loft(on(PX(x0),profileUV), on(PX(x1),profileUV), n=>shade(n,m)); }
// Vertical cylinder (axis z) centred (x,y), radius r from z0 to z1, with top cap.
function cyl(x,y,z0,z1,r,m,shade=toneI,w=1.2,n=24){
  const A=on(PZ(z0),ellUV(x,y,r,r,n)), B=on(PZ(z1),ellUV(x,y,r,r,n));
  return loft(A,B,nr=>shade(nr,m)) + fill(pd(B),shade([0,0,1],m)) + hullInk([...A,...B],w) + ink(pd(B),w*.8);
}
// Cylinder lying along x (e.g. a knob or dial sticking out of a front face): centred (y,z), from x0 to x1.
function cylX(x0,x1,y,z,r,m,shade=toneI,w=1.1,n=20){
  const A=on(PX(x0),ellUV(y,z,r,r,n)), B=on(PX(x1),ellUV(y,z,r,r,n));
  // cap on whichever end faces the viewer (the +x end in VIEW 0)
  const capB = vis([1,0,0]), cap = capB ? B : A, cn = capB ? [1,0,0] : [-1,0,0];
  return loft(A,B,nr=>shade(nr,m)) + (vis(cn) ? fill(pd(cap),shade(cn,m)) : '') + hullInk([...A,...B],w) + (vis(cn) ? ink(pd(cap),w*.8) : '');
}
// Cylinder between any two 3D points a and b (a lamp arm, a rod, a pipe at an angle, a handle bar), radius r.
// The end facing the viewer gets a cap. For a tapered part (a cone, a lamp shade) pass r1 for the radius at b.
function rod(a, b, r, m, shade=toneI, w=1, r1=r, n=16){
  const d = norm(sub(b, a)), u = norm(cross(d, Math.abs(d[2]) < .9 ? [0,0,1] : [1,0,0])), v = cross(d, u);
  const ring = (p, rr) => Array.from({length:n}, (_,i) => { const t = i/n*2*Math.PI, c = Math.cos(t)*rr, s2 = Math.sin(t)*rr;
    return [p[0] + u[0]*c + v[0]*s2, p[1] + u[1]*c + v[1]*s2, p[2] + u[2]*c + v[2]*s2]; });
  const A = ring(a, r), B = ring(b, r1), capB = vis(d), cap = capB ? B : A, cn = capB ? d : d.map(x => -x);
  return loft(A, B, nr => shade(nr, m)) + (Math.max(r, r1) > 0 ? fill(pd(cap), shade(cn, m)) + ink(pd(cap), w*.8) : '') + hullInk([...A, ...B], w);
}
// Text lying flat on a front plane x = const, centred at (y,z) baseline; reads left-to-right on screen.
const txM = (o, U, V) => `matrix(${U[0].toFixed(4)} ${U[1].toFixed(4)} ${V[0].toFixed(4)} ${V[1].toFixed(4)} ${f(o[0])} ${f(o[1])})`;
const tx = (x,y,z,str,size,col=INK,weight=700) => { const o=P(x,y,z);
  return `<text transform="${txM(o, Dv(0,-1,0), Dv(0,0,-1))}" font-size="${size}" fill="${col}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="${weight}" letter-spacing=".04em">${str}</text>`; };
// Text on a side plane y = const, centred at (x,z).
const txY = (x,y,z,str,size,col=INK,weight=700) => { const o=P(x,y,z);
  return `<text transform="${txM(o, Dv(1,0,0), Dv(0,0,-1))}" font-size="${size}" fill="${col}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="${weight}" letter-spacing=".04em">${str}</text>`; };
// Cast shadow of a set of 3D points (any outline of the object), pushed along the light onto z = 0.
// the light stays put relative to the viewer, so the shadow is cast in turned coordinates
// z0: the surface it falls on (a board, a counter); clip it to that surface with clipTo(...) if it could spill off.
// clip: the 3D outline of the surface it falls on (e.g. boardTop(...)), so it can't spill over the edge.
const castShadow = (pts3, z0=0, clip=null) => { const k = SHADOW_LEN / SHADOW_K;
  const s = fill(sp(hull(pts3.map(([x,y,z]) => { const [a,b] = rotXY(x,y); return P0(a+(z-z0)*SH[0]*k, b+(z-z0)*SH[1]*k, z0); }))), SHADOW);
  return clip ? clipTo(clip, s) : s; };
// A board for the object to stand on (a tray, a desk top, a counter): a rounded slab from (x0,y0) to (x1,y1), h thick.
// Draw it first; then castShadow(points, h, boardTop(x0,y0,x1,y1,h,r)) so shadows lie on it and stop at its edge.
const BOARD = { l:'#e6e1d4', m:'#cfc8b8', d:'#aaa293' }, WOOD = { l:'#d9a86c', m:'#bf8a4f', d:'#8e6236' };
const boardTop = (x0,y0,x1,y1,h=3,r=5) => on(PZ(h), rrUV(x0,y0,x1,y1,r));
function board(x0,y0,x1,y1,h=3,r=5,m=BOARD){
  const A = on(PZ(0), rrUV(x0,y0,x1,y1,r)), B = boardTop(x0,y0,x1,y1,h,r);
  return loft(A, B, n => toneI(n, m)) + fill(pd(B), m.l) + ink(pd(B), 1) + hullInk([...A, ...B], 1.8);
}
// Group helpers: clickable target, clip to an opening.
const act  = (name, inner, data='') => `<g data-act="${name}" ${data}>${inner}</g>`;
let _clipN = 0;
// Part label (for "how does it work" figures): a cream pill with a leader line to a 3D point on the part.
// dx, dy = where the pill sits, in screen units at the reference zoom (they scale with the figure like stroke widths).
// on = that part is working right now (the pill turns the accent colour). Labels can be hidden with the Labels switch.
function tag(p3, dx, dy, text, on=false){
  const k = INK_K, [X,Y] = P(...p3), fs = 8.6*k, w = text.length*fs*.62 + fs*1.5, h = fs*1.8, cx = X + dx*k, cy = Y + dy*k;
  return `<g class="tag${on ? ' on' : ''}"><path d="M${f(X)} ${f(Y)}L${f(cx)} ${f(cy)}" fill="none" stroke="${INK}" stroke-width="1"/>`
    + `<circle cx="${f(X)}" cy="${f(Y)}" r="${f(1.3*k)}" fill="${INK}"/>`
    + `<rect x="${f(cx-w/2)}" y="${f(cy-h/2)}" width="${f(w)}" height="${f(h)}" rx="${f(h/2)}" fill="${on ? 'var(--accent,#f4b829)' : '#fff4d6'}" stroke="${INK}" stroke-width="1.2"/>`
    + `<text x="${f(cx)}" y="${f(cy+fs*.36)}" font-size="${f(fs)}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="800" letter-spacing=".04em" fill="${INK}">${text}</text></g>`;
}
const clipTo = (pts3, inner) => { const id = 'k' + (++_clipN); return `<clipPath id="${id}"><path d="${pd(pts3)}"/></clipPath><g clip-path="url(#${id})">${inner}</g>`; };

/* ---------- constant on-screen line weight ----------
   Stroke widths are written in model units, and each figure is zoomed to fill the frame, so a small
   object would get fat lines. INK_K rescales every stroke-width (and the wobble/grain filter) so all
   figures match the reference zoom of the booth / vending machine (viewBox ≈ 585 units wide). */
const INK_REF_VB = 585;
let INK_K = 1;
const inkScale = svg => INK_K === 1 ? svg : svg.replace(/stroke-width="([\d.]+)"/g, (_, w) => `stroke-width="${(+w * INK_K).toFixed(2)}"`);

/* ---------- page shell ---------- */
const CORE_CSS = `
  :root{--paper:#f2efe7;--ink:#231e16;--muted:#857d6e;--rule:#ddd6c8}
  *{box-sizing:border-box} html,body{margin:0;height:100%}
  body{background-color:var(--paper);
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='320' height='320'><filter id='p'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .42  0 0 0 0 .39  0 0 0 0 .33  .16 0 0 0 0'/></filter><rect width='100%' height='100%' filter='url(%23p)'/></svg>");
    overflow-x:hidden;color:var(--ink);font:13px/1.4 ui-monospace,SFMono-Regular,Menlo,monospace;display:flex;flex-direction:column;align-items:center;padding:24px 16px 32px}
  header{width:100%;max-width:760px;display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
  header h1{font-size:13px;font-weight:600;margin:0;letter-spacing:.02em} header span{color:var(--muted)}
  #fig{width:100%;max-width:760px;height:auto;display:block;margin:4px 0 8px;user-select:none;overflow:visible}
  #fig [data-act]{cursor:pointer}
  #readout, .idea{display:none}   /* status line + big idea are off: the buttons and motion tell the story */
  .idea{width:100%;max-width:760px;margin:-6px 0 16px;font-size:12.5px;line-height:1.5;text-align:center;color:var(--ink)}
  .idea strong{letter-spacing:.12em;text-transform:uppercase;font-size:11px;margin-right:8px}
  #readout{position:relative;min-height:1.4em;letter-spacing:.08em;text-transform:uppercase;margin-bottom:14px;text-align:center;text-shadow:0 0 3px var(--paper),0 0 6px var(--paper),0 0 10px var(--paper)}
  .stage{position:relative;width:100%;max-width:760px}
  .actions{position:absolute;top:4px;left:0;display:flex;flex-direction:column;align-items:flex-start;gap:8px;z-index:2;max-width:220px}
  .actions .cap{color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase;margin:0 0 2px}
  html.nolabels #fig .tag{display:none}
  .ctl[hidden]{display:none}
  /* ui.flash(text): a short note under the buttons ("the can is empty — refill it"); the status line itself stays hidden */
  .toast{position:absolute;left:0;z-index:3;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;background:var(--paper);
    border:1.5px solid var(--ink);border-radius:8px;padding:4px 9px;box-shadow:2px 2px 0 var(--ink);opacity:0;transition:opacity .2s;pointer-events:none;max-width:240px}
  .toast.show{opacity:1}
  .made-with{width:100%;max-width:760px;margin-top:18px;text-align:right;font-size:11px;letter-spacing:.1em;text-transform:uppercase}
  .made-with a{color:var(--muted);text-decoration:none} .made-with a:hover{color:var(--ink)}
  .stats{position:absolute;top:4px;right:0;display:flex;flex-direction:column;align-items:flex-end;gap:10px;z-index:2;text-align:right}
  .stat .k{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .stat .v{font-size:34px;font-weight:800;line-height:1.05;letter-spacing:-.01em;font-variant-numeric:tabular-nums;color:var(--ink)}
  .stat.small .v{font-size:20px}
  .stat .v.bump{animation:bump .35s ease-out}
  @keyframes bump{0%{transform:scale(1.18)}100%{transform:none}}
  .stepwrap{position:relative;display:flex;align-items:center;gap:8px}
  .act{font:inherit;color:var(--ink);background:var(--paper);border:1.5px solid var(--ink);border-radius:999px;padding:5px 14px;cursor:pointer;white-space:nowrap}
  .act:hover{background:color-mix(in srgb,var(--paper) 92%,var(--ink))}
  .act .car{margin-left:6px;font-size:10px}
  .act:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
  .chips{display:none;flex-wrap:wrap;gap:6px;background:var(--paper);border:2px solid var(--ink);border-radius:12px;box-shadow:3px 3px 0 var(--ink);

      for (const c of b.choices(st)){ const ch = document.createElement('button'); ch.className = 'chip' + (c.current ? ' current' : c.disabled ? ' off' : ''); ch.textContent = c.label;

  const starts = (el, t) => el.textContent.trim().toLowerCase().startsWith(t.trim().toLowerCase());
  if (q.has('press')) q.get('press').split(',').forEach(item => { const [what, ms] = item.split('@'), [label, choice] = what.split('>');

<script>
/* ---------- geometry (x = depth, y = width, z = up) ----------
   A double-track line leaves a tunnel at the far end (y = 0) and runs toward the viewer-left into a terminal
   with two stub platforms (buffer stops at y = 204). Line 1 (x = 52) is the IN line and leads straight to
   platform 1; line 2 (x = 32) is the OUT line and leads straight to platform 2. Between them, a scissors
   crossover: diagonal A joins IN to platform 2, diagonal B joins platform 1 to OUT. Each lever moves both
   switches of its diagonal. */
const BD = [0, 0, 84, 222, 3, 5];
const PORTAL = [0, 16], PORTAL_H = 46;
const NODES = { P1:[52, -150], S1a:[52, 44], S1b:[52, 92], B1:[52, 204], P2:[32, -150], S2a:[32, 44], S2b:[32, 92], B2:[32, 204] };
const EDGES = { e1m:['P1','S1a'], e1x:['S1a','S1b'], e1s:['S1b','B1'], e2m:['P2','S2a'], e2x:['S2a','S2b'], e2s:['S2b','B2'], A:['S1a','S2b'], B:['S2a','S1b'] };
const SWITCHES = { S1a:{ lever:'A', stem:'e1m', N:'e1x', R:'A' }, S2b:{ lever:'A', stem:'e2s', N:'e2x', R:'A' },
                   S2a:{ lever:'B', stem:'e2m', N:'e2x', R:'B' }, S1b:{ lever:'B', stem:'e1s', N:'e1x', R:'B' } };
const LEVER_NODES = { A:['S1a','S2b'], B:['S2a','S1b'] };
const PLAT1 = [62, 76], PLAT2 = [8, 22], PLAT_Y = [110, 206], PZT = 11, CONC_Y = [206, 220];      // platforms at train-floor height
const HUT = [3, 54, 17, 74, 24];                          // signal box x0,y0,x1,y1,z1
const SIGN = { x: 74, y0: 194, y1: 220, z0: 18, z1: 32 };
const CAR_L = 40, CAR_GAP = 2, NCARS = 2, TRAIN_L = NCARS*CAR_L + (NCARS - 1)*CAR_GAP, CAR_W = 16;
const STOP_AT = 202;                                      // a train's head stops here, just short of the buffer

/* ---------- timetable ---------- */
const PERIOD = 30, FIRST = 5, DWELL = 45, VMAX = 28, ACC = 7;
const TRAIN_COLS = ['#e2473a', '#3e86d9', '#f2b431', '#38a565', '#8c4bd1', '#f08a2b'];
const CONC = { l:'#e3dfd5', m:'#c9c4b8', d:'#9e998e' }, GRASS = '#9cc47a';
const BALLAST = matOf('#a8a093'), SLEEPER = matOf('#7a5a3c');

/* ---------- state ---------- */
const st = { pal:'cobalt', t:0, paused:false, lever:{ A:false, B:false }, trains:[], nextArr:FIRST, seq:0,
             safe:0, crashes:0, wrong:0, smoke:[] };

/* ---------- track graph ---------- */
const v2 = n => NODES[n];
const elen = e => { const [a, b] = EDGES[e], p = v2(a), q = v2(b); return Math.hypot(q[0] - p[0], q[1] - p[1]); };
const other = (e, n) => EDGES[e][0] === n ? EDGES[e][1] : EDGES[e][0];
const isBuffer = n => n === 'B1' || n === 'B2', isPortal = n => n === 'P1' || n === 'P2';
// where a train coming into `node` along `via` goes next: an edge, 'exit', 'buffer' or 'derail'
function nextEdge(node, via){
  if (isPortal(node)) return 'exit';
  if (isBuffer(node)) return 'buffer';
  const sw = SWITCHES[node], set = st.lever[sw.lever] ? 'R' : 'N';
  if (via === sw.stem) return sw[set];                    // facing: follow the points
  if (via === sw[set]) return sw.stem;                    // trailing, points set for us
  return 'derail';                                        // trailing through points set the other way
}
const headPos = h => { const p = v2(h.to), q = v2(other(h.edge, h.to)), L = elen(h.edge), u = h.d / L; return [p[0] + (q[0] - p[0])*u, p[1] + (q[1] - p[1])*u]; };

/* ---------- trains: a head moving through the graph and a trail of points behind it ---------- */
function body(tr){ return [...tr.trail, headPos(tr.head)]; }
function bodyAt(tr, s){                                   // point s units behind the head
  const pts = body(tr);
  for (let i = pts.length - 1; i > 0; i--){
    const a = pts[i], b = pts[i - 1], L = Math.hypot(a[0] - b[0], a[1] - b[1]);
    if (s <= L || i === 1){ const u = L ? Math.min(1, s / L) : 0; return [a[0] + (b[0] - a[0])*u, a[1] + (b[1] - a[1])*u]; }
    s -= L;
  }
  return pts[0];
}
function trimTrail(tr){
  const pts = body(tr); let s = 0;
  for (let i = pts.length - 1; i > 0; i--){ s += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); if (s > TRAIN_L + 10){ tr.trail = tr.trail.slice(i - 1); return; } }
}
function advance(tr, dist){
  while (dist > 1e-6){
    const h = tr.head;
    if (dist < h.d){ h.d -= dist; return null; }
    dist -= h.d;
    const node = h.to, nx = nextEdge(node, h.edge);
    if (nx === 'exit') return 'exit';
    if (nx === 'buffer'){ h.d = 0; return 'buffer'; }
    if (nx === 'derail'){ h.d = 0; return 'derail:' + node; }
    tr.trail.push(v2(node).slice());
    h.edge = nx; h.to = other(nx, node); h.d = elen(nx);
  }
  return null;
}
function spawnArrival(){
  const k = st.seq++;
  st.trains.push({ id:k, col: TRAIN_COLS[k % TRAIN_COLS.length], state:'arriving', v:VMAX,
    head:{ edge:'e1m', to:'S1a', d: 44 + 60 }, trail:[[52, -60 - TRAIN_L - 4]], departAt: st.nextArr + DWELL });
}
// the train's own outline, head first, exactly TRAIN_L long (the stored trail can reach further back)
function bodyPoly(tr){
  const pts = body(tr), out = [pts[pts.length - 1]]; let left = TRAIN_L;
  for (let i = pts.length - 1; i > 0 && left > 0; i--){
    const a = pts[i], b = pts[i - 1], L = Math.hypot(a[0] - b[0], a[1] - b[1]);
    if (L >= left){ const u = left / L; out.push([a[0] + (b[0] - a[0])*u, a[1] + (b[1] - a[1])*u]); left = 0; }
    else { out.push(b); left -= L; }
  }
  return out;
}
function startDeparture(tr){
  const poly = bodyPoly(tr);                              // head … tail; the old tail becomes the new head
  const e = tr.head.edge, sNode = other(e, tr.head.to);    // e1s/e2s, toward S1b/S2b
  const newHead = poly[poly.length - 1];
  tr.trail = poly.slice(0, -1);                           // old head … just behind the new head
  tr.head = { edge: e, to: sNode, d: Math.hypot(newHead[0] - v2(sNode)[0], newHead[1] - v2(sNode)[1]) };
  tr.state = 'departing'; tr.v = 0;
}
const platformOf = tr => tr.head.edge === 'e1s' ? 1 : tr.head.edge === 'e2s' ? 2 : 0;

/* ---------- crashes ---------- */
function crash(trs, why){
  for (const tr of trs){ if (tr.state !== 'crash'){ tr.state = 'crash'; tr.v = 0; tr.yaw = (tr.id % 2 ? 1 : -1) * .12; } }
  const p = bodyAt(trs[0], 0);
  st.smoke.push({ p, t: 0 });
  st.crashes++;
  st.halted = true;
  ui.flash('CRASH! ' + why + ' Everything is stopped — clear the wreck to carry on.', 5000);
}
// two trains touch when their centre lines come closer than about a train's width (the two lines are 20 apart)
const TOUCH = 14.5;
function samples(tr){ const o = []; for (let s = 0; s <= TRAIN_L; s += 3) o.push(bodyAt(tr, s)); return o; }
function checkCollisions(){
  const T = st.trains, S = T.map(samples);
  for (let i = 0; i < T.length; i++) for (let j = i + 1; j < T.length; j++){
    if (T[i].state === 'crash' && T[j].state === 'crash') continue;
    let hit = false;
    for (const a of S[i]){ for (const b of S[j]) if (Math.hypot(a[0] - b[0], a[1] - b[1]) < TOUCH){ hit = true; break; } if (hit) break; }
    if (hit){ crash([T[i], T[j]], 'two trains collided.'); return; }
  }
}
const nearNodes = names => st.trains.some(tr => samples(tr).some(p => names.some(n => Math.hypot(p[0] - v2(n)[0], p[1] - v2(n)[1]) < 10)));

/* test mode (?check=1): count steps where two trains' footprints overlap but no crash was registered */
function footprints(tr){ return carsOf(tr).map(c => { const d = norm([c.pf[0] - c.pb[0], c.pf[1] - c.pb[1], 0]), n = [-d[1], d[0]];
  return [[c.pb[0] + n[0]*8, c.pb[1] + n[1]*8], [c.pf[0] + n[0]*8, c.pf[1] + n[1]*8], [c.pf[0] - n[0]*8, c.pf[1] - n[1]*8], [c.pb[0] - n[0]*8, c.pb[1] - n[1]*8]]; }); }
function overlap(A, B){
  for (const poly of [A, B]) for (let i = 0; i < 4; i++){
    const p = poly[i], q = poly[(i + 1) % 4], ax = -(q[1] - p[1]), ay = q[0] - p[0];
    const pa = A.map(v => v[0]*ax + v[1]*ay), pb = B.map(v => v[0]*ax + v[1]*ay);
    if (Math.max(...pa) <= Math.min(...pb) + .3 || Math.max(...pb) <= Math.min(...pa) + .3) return false;
  }
  return true;
}
function ghostCheck(){
  const T = st.trains;
  for (let i = 0; i < T.length; i++) for (let j = i + 1; j < T.length; j++){
    if (T[i].state === 'crash' && T[j].state === 'crash') continue;
    const fa = footprints(T[i]), fb = footprints(T[j]);

/* ---------- simulation ---------- */
function step(dt){
  if (st.chaos && st.halted){ st.trains = st.trains.filter(t => t.state !== 'crash'); st.halted = false; }
  if (st.paused || st.halted) return true;
  st.t += dt;
  if (st.auto) autopilot();
  if (st.chaos && Math.random() < dt/3) { const lv = Math.random() < .5 ? 'A' : 'B'; if (!nearNodes(LEVER_NODES[lv])) st.lever[lv] = !st.lever[lv]; }
  const ends = tr => [bodyAt(tr, 0), bodyAt(tr, TRAIN_L)], before = st.check ? st.trains.map(tr => [tr, ends(tr)]) : null;
  if (st.t >= st.nextArr){ spawnArrival(); st.nextArr += PERIOD; }
  for (const tr of st.trains.slice()){
    if (tr.state === 'arriving'){
      const hy = headPos(tr.head)[1], rem = (isBuffer(tr.head.to) ? tr.head.d - (v2(tr.head.to)[1] - STOP_AT) : STOP_AT - hy);
      tr.v = Math.min(VMAX, Math.sqrt(2*ACC*Math.max(0, rem)) + .5);
      const r = advance(tr, Math.min(tr.v*dt, Math.max(0, rem)));
      if (r && r.startsWith('derail')) crash([tr], `the train ran through switch ${SWITCHES[r.slice(7)].lever} — it was set the other way.`);
      else if (rem - tr.v*dt <= .05 && isBuffer(tr.head.to)){ tr.state = 'stopped'; tr.v = 0; }
    } else if (tr.state === 'departing'){
      tr.v = Math.min(VMAX, tr.v + ACC*dt);
      const r = advance(tr, tr.v*dt);
      if (r === 'exit'){
        st.trains.splice(st.trains.indexOf(tr), 1);
        if (tr.head.to === 'P2'){ st.safe++; }
        else { st.wrong++; ui.flash('That train left on the IN line — wrong way!', 2500); }
      } else if (r && r.startsWith('derail')) crash([tr], `the train ran through switch ${SWITCHES[r.slice(7)].lever} — it was set the other way.`);
    } else if (tr.state === 'stopped' && st.t >= tr.departAt) startDeparture(tr);

  checkCollisions();
  if (st.check) ghostCheck();
  if (st.check && st.halted){ document.documentElement.dataset.halt = (document.documentElement.dataset.halt || 0) - -1; }
  for (const s of st.smoke) s.t += dt;
  return true;
}

/* ---------- routes for the overlay ---------- */
function trace(startNode, edge){
  const pts = [v2(startNode)]; let node = startNode, e = edge, guard = 0;
  while (guard++ < 10){
    const to = other(e, node); pts.push(v2(to));
    if (isBuffer(to) || isPortal(to)) return { pts, end: to };
    const nx = nextEdge(to, e);
    if (nx === 'derail') return { pts, end: 'derail', at: to };
    node = to; e = nx;
  }
  return { pts, end: null };
}
const occupied = k => st.trains.some(tr => tr.state !== 'departing' && platformOf(tr) === k);
function nextDeparture(){
  const s = st.trains.filter(tr => tr.state === 'stopped').sort((a, b) => a.departAt - b.departAt)[0];
  return s ? { tr: s, k: platformOf(s) } : null;
}
function routeLine(pts, col, dash = ''){
  const p3 = pts.map(([x, y]) => [x, Math.max(y, PORTAL[1]), 6.8]);

/* ---------- drawing: track ---------- */
const perp = (a, b) => { const dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy); return [-dy/L, dx/L, dx/L, dy/L, L]; };

  let [a, b] = EDGES[e].map(v2);
  const clampY = (p, q) => { if (p[1] >= lo) return p; const u = (lo - p[1]) / (q[1] - p[1]); return [p[0] + (q[0] - p[0])*u, lo]; };
  a = clampY(a, b); b = clampY(b, a);
  const [nx, ny, dx, dy, L] = perp(a, b);
  const off = (p, o, s = 0) => [p[0] + nx*o + dx*s, p[1] + ny*o + dy*s];
  const ballast = [[...off(a, -10.5), 4.6], [...off(b, -10.5), 4.6], [...off(b, 10.5), 4.6], [...off(a, 10.5), 4.6]];

  for (let s = 3; s < L - 2; s += 8.5) sleepers.push([[...off(a, -8.5, s), 5.3], [...off(a, -8.5, s + 2.4), 5.3], [...off(a, 8.5, s + 2.4), 5.3], [...off(a, 8.5, s), 5.3]]);

}
function trackSVG(){
  const parts = Object.keys(EDGES).map(e => edgeParts(e));

  s += `<path d="${parts.map(p => p.sleepers.map(q => pd(q)).join('')).join('')}" fill="${SLEEPER.l}" stroke="${INK}" stroke-width=".35"/>`;
  s += parts.map(p => p.rails.map(([a, b]) => `<path d="${pd([a, b], false)}" stroke="${INK}" stroke-width="2.1" stroke-linecap="round"/><path d="${pd([a, b], false)}" stroke="#d9dee0" stroke-width=".9" stroke-linecap="round"/>`).join('')).join('');
  return s;
}
function buffers(){
  let s = '';
  for (const x of [32, 52]){
    s += box(x - 7, 203.5, 4.6, x + 7, 206, 13, matOf('#5b5650'), toneI, 1);
    s += shape(on(PY(206.05), rectUV(x - 6, 9, x + 6, 12.4)), '#e2483d', .7);

}

/* ---------- drawing: trains ---------- */
function carSVG(pb, pf, col, opts){

  const Q = (p, o, z) => [p[0] + n2[0]*o, p[1] + n2[1]*o, z];

  const ub = [pb[0] + d2[0]*3, pb[1] + d2[1]*3], uf = [pf[0] - d2[0]*3, pf[1] - d2[1]*3];

  for (const sgn of [1, -1]){ const nn = n2.map(v => v*sgn); if (vis(nn)) s += shape([Q(ub, sgn*(w - 2), 5.5), Q(uf, sgn*(w - 2), 5.5), Q(uf, sgn*(w - 2), 9.5), Q(ub, sgn*(w - 2), 9.5)], toneI(nn, DARK), .8); }

    { n: n2.map(v => -v),     q: [Q(pb, -w, 9.5), Q(pf, -w, 9.5), Q(pf, -w, 34), Q(pb, -w, 34)], side: -w },

    { n: d2.map(v => -v),     q: [Q(pb, -w, 9.5), Q(pb, w, 9.5), Q(pb, w, 34), Q(pb, -w, 34)], end: pb, cab: opts.cabB },
  ];
  for (const fc of faces) if (vis(fc.n)){
    s += shape(fc.q, tone(fc.n, m), 1.1);

      const o = fc.side*1.01, along = (u, z) => Q([pb[0] + (pf[0] - pb[0])*u, pb[1] + (pf[1] - pb[1])*u], o, z);
      s += fill(pd([along(0, 14), along(1, 14), along(1, 16), along(0, 16)]), '#fbf7ea');
      for (const [u0, u1] of [[.08, .3], [.38, .62], [.7, .92]]) s += shape([along(u0, 20), along(u1, 20), along(u1, 29), along(u0, 29)], '#2c3b44', .7);

      for (const o of [-w + 3.5, w - 3.5]){ const [X, Y] = P(...Q([e[0] + oo[0], e[1] + oo[1]], o, 14.5)); s += `<circle cx="${f(X)}" cy="${f(Y)}" r="1.2" fill="#fff4c2" stroke="${INK}" stroke-width=".5"/>`; }
    }

  s += shape([Q(pb, -w, 34), Q(pf, -w, 34), Q(pf, w, 34), Q(pb, w, 34)], METAL.l, 1.1);           // roof

}
// clip a car (pb..pf) to the y range [lo, hi]
function clipCar(pb, pf, lo, hi){
  const dy = pf[1] - pb[1];
  let u0 = 0, u1 = 1;
  if (Math.abs(dy) < 1e-6){ if (pb[1] < lo || pb[1] > hi) return null; }
  else { let a = (lo - pb[1]) / dy, b = (hi - pb[1]) / dy; if (a > b) [a, b] = [b, a]; u0 = Math.max(0, a); u1 = Math.min(1, b); if (u1 - u0 < .01) return null; }

  return [at(u0), at(u1), u0 > 0, u1 < 1];
}
function carsOf(tr){
  const out = [];
  for (let c = 0; c < NCARS; c++){
    let pf = bodyAt(tr, c*(CAR_L + CAR_GAP)), pb = bodyAt(tr, c*(CAR_L + CAR_GAP) + CAR_L);
    if (tr.state === 'crash'){ const cx = (pf[0] + pb[0])/2, cy = (pf[1] + pb[1])/2, a = tr.yaw*(c ? -1 : 1), co = Math.cos(a), si = Math.sin(a);

// cars are long boxes, so one depth number can't order them: a car entirely behind another along x (or, failing

function orderCars(parts){

  const out = [], left = parts.slice();
  while (left.length){
    let pick = left.filter(a => !left.some(b => b !== a && before(b, a)));
    if (!pick.length) pick = left;
    pick.sort((a, b) => a.depth - b.depth);
    out.push(pick[0]); left.splice(left.indexOf(pick[0]), 1);

let _carClip = 0;
function trainsSVG(lo, hi){
  const parts = [];
  for (const tr of st.trains) for (const c of carsOf(tr)){
    const k = clipCar(c.pb, c.pf, lo, hi); if (!k) continue;
    const [pb, pf, cutB, cutF] = k;
    let svg = carSVG(c.pb, c.pf, tr.col, { cabF: c.cabF, cabB: c.cabB });

function trainShadows(){

    const [pb, pf] = k, d2 = norm([pf[0] - pb[0], pf[1] - pb[1], 0]), n2 = [-d2[1], d2[0]];

/* ---------- drawing: the rest ---------- */
const archUV = () => { const o = [[17, BD[4]], [67, BD[4]]]; for (let i = 0; i <= 14; i++){ const a = i/14*Math.PI; o.push([42 + 25*Math.cos(a), 22 + 20*Math.sin(a)]); } return o; };
function portal(){
  let s = '';

  for (const x of [27, 37, 47, 57]) inner += `<path d="${pd([[x, PORTAL[1], 6], [x, -60, 6]], false)}" stroke="#6f777a" stroke-width=".8"/>`;
  inner += trainsSVG(-999, PORTAL[1]);

  const [x0, x1, z0, z1, y0, y1] = [BD[0], BD[2], BD[4], PORTAL_H, PORTAL[0], PORTAL[1]];
  s += shape([[x1, y0, z0], [x1, y1, z0], [x1, y1, z1], [x1, y0, z1]], tone([1,0,0], CONC), 1.2);
  s += shape([[x0, y0, z1], [x1, y0, z1], [x1, y1, z1], [x0, y1, z1]], GRASS, 1.2);

  s += ink(pd(hole), 1.6) + ink(pd(on(PY(y1), rectUV(x0, z0, x1, z1))), 1.4);

}
function platform(x0, x1, k){
  let s = box(x0, PLAT_Y[0], BD[4], x1, PLAT_Y[1], PZT, CONC, tone, 1.3);
  const xe = k === 1 ? x0 + 1.4 : x1 - 2.4;
  s += fill(pd(on(PZ(PZT + .05), rectUV(xe, PLAT_Y[0] + 1, xe + 1, PLAT_Y[1] - 1))), '#f2c230');
  s += `<text transform="${txM(P((x0 + x1)/2, 150, PZT + .1), Dv(0, -1, 0), Dv(1, 0, 0))}" font-size="8" fill="${CONC.d}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="800">${k}</text>`;

}
function groundText(x, y, str){ return `<text transform="${txM(P(x, y, BD[4] + .05), Dv(0, -1, 0), Dv(1, 0, 0))}" font-size="5" fill="#6a6658" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="800">${str}</text>`; }
function switchPlate(node){
  const sw = SWITCHES[node], [x, y] = v2(node), rev = st.lever[sw.lever], front = x > 42;
  const px = front ? x + 13 : x - 16, col = rev ? '#f2b431' : '#fbf7ea';
  let s = box(px, y - 3, BD[4], px + 3, y + 3, 9, matOf(col), toneI, .9);

}
function signalBox(m){
  const [x0, y0, x1, y1, z1] = HUT;

  s += shape(on(PX(x1 + .05), rectUV(y0 + 3, 14, y1 - 3, 21)), '#cfe9f0', .9);                 // window
  s += box(x0 - 1, y0 - 1, z1, x1 + 1, y1 + 1, z1 + 1.6, DARK, toneI, 1);                          // roof
  s += tx(x1 + .1, (y0 + y1)/2, 23 - 1.6, 'SIGNAL BOX', 2, '#fbf7ea', 800);

const clock = s => { s = Math.max(0, Math.ceil(s)); return Math.floor(s/60) + ':' + String(s % 60).padStart(2, '0'); };

  const { x, y0, y1, z0, z1 } = SIGN;

function scene(st, m){
  _carClip = 0;
  const top = boardTop(...BD);
  let s = board(...BD, matOf('#cfc8b8'));
  let sh = '';
  for (const [x0, x1] of [PLAT1, PLAT2]){ const pts = []; for (const x of [x0, x1]) for (const y of PLAT_Y) for (const z of [3, PZT]) pts.push([x, y, z]); sh += castShadow(pts, BD[4]); }
  { const pts = []; for (const x of [HUT[0], HUT[2]]) for (const y of [HUT[1], HUT[3]]) for (const z of [3, HUT[4]]) pts.push([x, y, z]); sh += castShadow(pts, BD[4]); }
  sh += trainShadows();
  s += clipTo(top, sh);
  s += portal();
  s += signalBox(m) + platform(...PLAT2, 2);
  s += trackSVG() + groundText(64, 30, 'IN') + groundText(20, 30, 'OUT');
  // routes: green = where the next arrival will go, blue = how the next departure will leave (red = trouble)
  const inR = trace('P1', 'e1m');
  const inOk = inR.end === 'B1' ? !occupied(1) : inR.end === 'B2' ? !occupied(2) : false;
  s += routeLine(inR.pts, inOk ? '#43c25c' : '#e2483d', inOk ? '' : 'stroke-dasharray="3 3"');
  const nd = nextDeparture();
  if (nd){ const outR = trace(nd.k === 1 ? 'B1' : 'B2', nd.k === 1 ? 'e1s' : 'e2s'); const ok = outR.end === 'P2';

  s += trainsSVG(PORTAL[1], 999);
  s += switchPlate('S1a') + switchPlate('S1b');
  // the raised end walkway and platform 1 are in front of the buffer stops and the trains, so they go after them
  // platform 1 first: the walkway, drawn after it, covers platform 1's end wall so the two meet at one level
  s += platform(...PLAT1, 1);
  s += box(PLAT2[0], CONC_Y[0], BD[4], PLAT1[1], CONC_Y[1], PZT, CONC, tone, 1.3);              // concourse
  s += signSVG();

  for (const tr of st.trains.filter(t => t.state === 'crash')){
    const p = bodyAt(tr, CAR_L), [X, Y] = P(p[0], p[1], 36);

    const fs = 4.4, w = 6*fs*.62 + fs*1.6, h = fs*1.9;
    s += `<rect x="${f(X - w/2)}" y="${f(Y - 22 - h/2)}" width="${f(w)}" height="${f(h)}" rx="${f(h/2)}" fill="#e2483d" stroke="${INK}" stroke-width="1.1"/><text x="${f(X)}" y="${f(Y - 22 + fs*.36)}" font-size="${fs}" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-weight="800" fill="#fff">CRASH!</text>`;

}

/* ---------- autopilot: a simple signaller that proves the timetable can be run safely ----------
   It looks at the next two moves (the next arrival and the next departure), serves whichever comes first,
   and only throws a lever when no train is on its switches. */
const tailY = tr => bodyAt(tr, TRAIN_L)[1];
function autopilot(){
  const want = [];
  // the arrival: from a little before it reaches switch A until its tail has passed the crossover
  const arr = st.trains.find(t => t.state === 'arriving' && tailY(t) < 100);
  const tArr = arr ? Math.max(0, (44 - headPos(arr.head)[1]) / VMAX) : st.nextArr - st.t + 104 / VMAX;
  const stopped = st.trains.filter(t => t.state === 'stopped');
  const target = arr && arr.head.edge !== 'e1m' ? (arr.head.edge === 'A' || arr.head.edge === 'e2s' ? 2 : 1)
    : !stopped.some(t => platformOf(t) === 1) && !st.trains.some(t => t.state === 'departing' && platformOf(t) === 1) ? 1 : 2;
  want.push({ t: tArr, need: target === 1 ? { A:false, B:false } : { A:true } });
  // the departure: from shortly before it leaves until its tail has cleared switch B/A at y = 44
  const dep = st.trains.find(t => t.state === 'departing' && tailY(t) > 36);
  const nd = nextDeparture();
  if (dep) want.push({ t: 0, need: platformOf(dep) === 1 || dep.head.edge === 'B' || dep.head.edge === 'e1x' ? { B:true } : { A:false, B:false } });
  else if (nd) want.push({ t: Math.max(0, nd.tr.departAt - st.t), need: nd.k === 1 ? { B:true } : { A:false, B:false } });
  want.sort((a, b) => a.t - b.t);
  for (const [lv, v] of Object.entries(want[0].need))
    if (st.lever[lv] !== v && !nearNodes(LEVER_NODES[lv])) st.lever[lv] = v;
}

/* ---------- controls ---------- */
let ui;
function throwLever(lv){
  if (nearNodes(LEVER_NODES[lv])) return ui.flash(`switch ${lv} is locked — a train is on it`);
  st.lever[lv] = !st.lever[lv];
  ui.flash(`switch ${lv}: ${st.lever[lv] ? (lv === 'A' ? 'IN line crosses to platform 2' : 'platform 1 crosses to the OUT line') : 'straight'}`, 1400);
}
ui = mountFigure({
  fig:'12', title:'Terminal station', hint:'throw switches A and B so every train gets in and out without a crash',
  size:[BD[2], BD[3], 112], palette:'cobalt', state:st,   // taller than the scene, so it sits lower and leaves the top right clear for the stats
  scene,
  readout: st => String(st.t.toFixed(0)),
  stats: st => { const nd = nextDeparture(); return [
    { label:'Next arrival', value: clock(st.nextArr - st.t) },
    { label:'Next departure', value: nd ? `P${nd.k} in ${clock(nd.tr.departAt - st.t)}` : '—', small:true },
    { label:'Safe trips', value: String(st.safe), small:true },
    { label:'Crashes', value: String(st.crashes), small:true },
    st.auto && { label:'Autopilot', value:'on', small:true },
    st.halted && { label:'Railway', value:'STOPPED', small:true },
  ]; },
  buttonsLabel:'Signal box',
  buttons:[
    { label:'Throw switch A', onClick: () => throwLever('A') },
    { label:'Throw switch B', onClick: () => throwLever('B') },
    { label:'Autopilot', onClick: (st, ui) => { st.auto = !st.auto; ui.flash(st.auto ? 'autopilot on — the signaller runs the switches' : 'autopilot off — over to you', 1800); } },
    { label:'Pause / resume', onClick: (st, ui) => { if (st.halted) return ui.flash('stopped after a crash — clear the wreck first'); st.paused = !st.paused; ui.flash(st.paused ? 'paused' : 'running', 900); } },
    { label:'Clear the wreck', onClick: (st, ui) => { const n = st.trains.filter(t => t.state === 'crash').length;
        if (!n) return ui.flash('no wreck on the line'); st.trains = st.trains.filter(t => t.state !== 'crash'); st.smoke = []; st.halted = false; ui.flash('the line is clear — trains are running again'); } },
  ],
  acts:{ leverA: () => throwLever('A'), leverB: () => throwLever('B') },
  params:(st, q) => { if (q.get('A') === '1') st.lever.A = true; if (q.get('B') === '1') st.lever.B = true; if (q.has('fast')) st.fast = +q.get('fast'); if (q.get('auto') === '1') st.auto = true; if (q.get('check') === '1') st.check = { jump:0, crashT:[] }; if (q.get('chaos') === '1') st.chaos = true; },
});
// ?fast=N runs the simulation N times faster (for testing a whole timetable quickly)
ui.animate(dt => { const n = st.fast || 1; for (let i = 0; i < n; i++) step(dt); return true; });
</script>
