<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Marble Run Adventure</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap">
<style>
/* Layout: one-screen toy. Top bar = name + world switch; middle = the track (or the track picker); bottom = marble pouch and big thumb buttons. */
:root {
  --font-display: "Baloo 2", "Comic Sans MS", "Trebuchet MS", system-ui, sans-serif;
  --ui-bg: #26324f;
  --ui-fg: #ffffff;
  --ui-chip: rgba(255,255,255,.14);
  --ui-accent: #ffbe0b;
  --ui-accent-fg: #26324f;
  --field-bg: #9fd8ff;
  --card-bg: rgba(255,255,255,.92);
  --card-fg: #26324f;
  color-scheme: dark;
}
body[data-world="city"]   { --ui-bg:#26324f; --ui-accent:#ffbe0b; --ui-accent-fg:#26324f; --field-bg:#9fd8ff; --card-bg:rgba(255,255,255,.92); --card-fg:#26324f; }
body[data-world="jungle"] { --ui-bg:#1d4a2b; --ui-accent:#ffb238; --ui-accent-fg:#1d4a2b; --field-bg:#4fae63; --card-bg:rgba(250,244,220,.94); --card-fg:#1d4a2b; }
body[data-world="space"]  { --ui-bg:#120c33; --ui-accent:#4cf2ff; --ui-accent-fg:#120c33; --field-bg:#0b1033; --card-bg:rgba(30,22,80,.92); --card-fg:#e9e4ff; }

html, body { height: 100%; }
body {
  background: var(--ui-bg); color: var(--ui-fg);
  font-family: var(--font-display);
  overflow: hidden; touch-action: none; user-select: none; -webkit-user-select: none;
  transition: background-color .4s;
}
.app { height: 100%; display: flex; flex-direction: column; }
.bar {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px;
  padding-block: 8px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.top { justify-content: space-between; }
.brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
.brand h1 { margin: 0; font-size: 1.6rem; font-weight: 800; line-height: 1; }
.chip { font-size: 1rem; font-weight: 700; padding: 2px 10px; border-radius: 999px; background: var(--ui-chip); white-space: nowrap; }
.themes { display: flex; gap: 6px; }
.bottom { justify-content: center; }
button {
  font: inherit; font-weight: 700; font-size: 1.05rem; color: var(--ui-fg);
  background: var(--ui-chip); border: 3px solid transparent; border-radius: 16px;
  padding: 6px 14px; min-height: 48px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 8px;
  transition: transform .12s, background-color .2s;
}
button:active { transform: scale(.94); }
button:focus-visible { outline: 3px solid var(--ui-fg); outline-offset: 2px; }
button[aria-pressed="true"], button.primary { background: var(--ui-accent); color: var(--ui-accent-fg); }
button:disabled { opacity: .45; cursor: default; transform: none; }
button svg { width: 24px; height: 24px; flex: none; }
.pouch-dots { display: inline-grid; grid-template-columns: repeat(5, 10px); gap: 3px; }
.pouch-dots i { width: 10px; height: 10px; border-radius: 50%; background: currentColor; }
.pouch-dots i.out { background: transparent; box-shadow: inset 0 0 0 1.5px currentColor; opacity: .5; }
.field { flex: 1; min-height: 0; position: relative; background: var(--field-bg); }
canvas#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; cursor: pointer; }
.hint {
  position: absolute; left: 50%; top: 10px; transform: translateX(-50%);
  background: rgba(0,0,0,.5); color: #fff; padding: 4px 14px; border-radius: 999px;
  font-size: .95rem; font-weight: 600; pointer-events: none; white-space: nowrap;
  max-width: calc(100% - 32px); overflow: hidden; text-overflow: ellipsis;
}
.picker {
  position: absolute; inset: 0; overflow-y: auto; touch-action: pan-y;
  background: color-mix(in srgb, var(--ui-bg) 55%, transparent);
  padding-block: 16px 24px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.picker h2 { margin: 0 0 12px; text-align: center; font-size: 1.8rem; font-weight: 800; text-wrap: balance; text-shadow: 0 2px 0 rgba(0,0,0,.25); }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 14px; max-width: 980px; margin: 0 auto; }
.card {
  flex-direction: column; align-items: stretch; gap: 6px; padding: 8px;
  background: var(--card-bg); color: var(--card-fg); border-radius: 20px;
  box-shadow: 0 6px 0 rgba(0,0,0,.22);
}
.card:hover { transform: translateY(-3px); }
.card canvas { width: 100%; aspect-ratio: 2 / 3; border-radius: 14px; display: block; max-width: 100%; }
.card .name { font-size: 1.2rem; font-weight: 800; line-height: 1.1; }
.card .parts { font-size: .85rem; font-weight: 600; opacity: .75; line-height: 1.2; }
@media (max-width: 520px) {
  .brand h1 { font-size: 1.25rem; }
  button { font-size: .95rem; padding: 4px 10px; gap: 6px; }
  .themes button .lbl, .hide-sm { display: none; }
  .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
}
@media (prefers-reduced-motion: reduce) { button { transition: none; } .card:hover { transform: none; } }
</style>

<div class="app">
  <div class="bar top">
    <div class="brand">
      <h1>Marble Run</h1>
      <span class="chip" id="track-name">Pick a track</span>
    </div>
    <div class="themes" role="group" aria-label="Choose a world">
      <button data-theme-btn="city" aria-pressed="true" title="City">

        <span class="lbl">City</span>
      </button>
      <button data-theme-btn="jungle" aria-pressed="false" title="Jungle">

  <div class="field" id="field">

    <div class="hint" id="hint" hidden></div>

      <h2>Pick a track to play</h2>

  <div class="bar bottom" id="controls">

    <button id="btn-all">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="6" cy="6" r="3"/><circle cx="15" cy="5" r="3"/><circle cx="10" cy="13" r="3"/><circle cx="18" cy="13" r="3"/><circle cx="7" cy="20" r="3"/><circle cx="15" cy="20" r="3"/></svg>
      Drop all
    </button>
    <button id="btn-pick">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 11V5.5a1.5 1.5 0 0 1 3 0V10m0-5.5v-1a1.5 1.5 0 0 1 3 0V10m0-5a1.5 1.5 0 0 1 3 0v6m0-3.5a1.5 1.5 0 0 1 3 0V15a7 7 0 0 1-7 7h-1a7 7 0 0 1-5.6-2.8L3.6 16a1.6 1.6 0 0 1 2.5-2L7 15"/></svg>
      Pick up all
    </button>
    <button id="btn-sound" aria-pressed="true" title="Sound on or off">
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 9h4l5-4v14l-5-4H3z"/><path id="snd-waves" d="M16 8c1.5 1.2 1.5 6.8 0 8m3-11c3 2.5 3 11.5 0 14" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
      <span class="hide-sm" id="sound-lbl">Sound</span>
    </button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
<script>
(function () {
const { Engine, Bodies, Body, Composite, Events, Constraint } = Matter;

// ================= World & themes =================
const W = 600, H = 900, R = 12, T = 12, MARBLES = 10;
const TRAY = { x1: 200, x2: 400, top: 810, floor: 880 };

const THEMES = {
  city: {
    gravity: 1,
    marbles: ['#e63946', '#1d7cf2', '#ffbe0b', '#2ec27e', '#ff6fb5', '#8338ec'],
    sky: ['#7cc8ff', '#c9ecff', '#ffe6bf'],
    pieces: ['#e63946', '#ffbe0b', '#1d7cf2', '#2ec27e', '#ff7f11', '#8338ec'],
    tray: '#1d7cf2', tower: '#c9ced8',
    particle: ['#ffd23f', '#ffffff', '#ff9f1c'],
    notes: [523, 587, 659, 784, 880, 1047],
  },
  jungle: {
    gravity: 1,
    marbles: ['#ff8c1a', '#9be15d', '#7b2cbf', '#e5383b', '#ffc300', '#ff5d8f'],
    sky: ['#1f6b3a', '#3f9a55', '#a6dc78'],
    pieces: ['#9a6236', '#8bc34a', '#b5773f', '#7cb342', '#8d5524', '#9ccc65'],
    tray: '#c58b4c', tower: '#8bc34a',
    particle: ['#7bd348', '#3fa34d', '#c9f27b'],
    notes: [392, 440, 523, 587, 659, 784],
  },
  space: {
    gravity: 0.6,
    marbles: ['#ff7b54', '#4cc9f0', '#f72585', '#b5e48c', '#ffd166', '#9d4edd'],
    sky: ['#060a24', '#140f45', '#2a1458'],
    pieces: ['#4cf2ff', '#ff4fd8', '#ffd166', '#7cff6b', '#b388ff', '#ff8a5b'],
    tray: '#b388ff', tower: '#5a6cff',
    particle: ['#4cf2ff', '#ffffff', '#ff4fd8'],
    notes: [440, 554, 659, 740, 880, 1109],
  },
};

// ================= The 5 tracks, built from pieces =================
// Pieces: ramp, stop, turn (U-turn), bell, spinner (windmill), seesaw, board (peg board), tower (support pole).
function pegRows() {
  const out = [];
  for (let row = 0; row < 7; row++) {
    const y = 125 + row * 62;
    const xs = row % 2 === 0 ? [75, 165, 255, 345, 435, 525] : [120, 210, 300, 390, 480];
    xs.forEach(x => out.push({ k: 'bell', p: [x, y], r: 11 }));
  }
  return out;
}
const TRACKS = [
  {
    name: 'Zigzag Tower', parts: 'Ramps, stops and bells',
    start: [70, 45],
    pieces: [
      { k: 'tower', x: 40, y1: 95, y2: 900 }, { k: 'tower', x: 545, y1: 140, y2: 900 },
      { k: 'ramp', a: [20, 110], b: [500, 195] }, { k: 'stop', a: [545, 145], b: [545, 215] },
      { k: 'ramp', a: [590, 255], b: [110, 340] }, { k: 'bell', p: [52, 345], r: 14 },
      { k: 'ramp', a: [10, 400], b: [490, 485] }, { k: 'stop', a: [535, 435], b: [535, 505] },
      { k: 'ramp', a: [590, 545], b: [110, 630] }, { k: 'bell', p: [52, 625], r: 14 },
      { k: 'ramp', a: [10, 685], b: [330, 735] }, { k: 'stop', a: [375, 690], b: [375, 760] },
    ],
  },
  {
    name: 'Twisty Turns', parts: 'Ramps and U-turns',
    start: [60, 35],
    pieces: [
      { k: 'tower', x: 300, y1: 110, y2: 900 },
      { k: 'ramp', a: [30, 80], b: [500, 160] }, { k: 'turn', c: [500, 175], r: 60, side: 'R' },
      { k: 'ramp', a: [500, 235], b: [100, 315] }, { k: 'turn', c: [100, 330], r: 60, side: 'L' },
      { k: 'ramp', a: [100, 390], b: [500, 470] }, { k: 'turn', c: [500, 485], r: 60, side: 'R' },
      { k: 'ramp', a: [500, 545], b: [100, 625] }, { k: 'turn', c: [100, 640], r: 60, side: 'L' },
      { k: 'ramp', a: [100, 700], b: [330, 745] }, { k: 'stop', a: [375, 705], b: [375, 775] },
    ],
  },
  {
    name: 'Bell Garden', parts: 'Peg board of bells',
    start: [300, 40],
    pieces: [
      { k: 'board', x1: 20, y1: 90, x2: 580, y2: 530 },
      ...pegRows(),
      { k: 'ramp', a: [0, 560], b: [240, 620] }, { k: 'ramp', a: [600, 560], b: [360, 620] },
      { k: 'ramp', a: [330, 655], b: [540, 700] },
      { k: 'bell', p: [430, 612], r: 13 },
    ],
  },
  {
    name: 'Spin & Seesaw', parts: 'Windmill, seesaw, bells',
    start: [60, 40],
    pieces: [
      { k: 'tower', x: 450, y1: 260, y2: 900 }, { k: 'tower', x: 300, y1: 450, y2: 900 },
      { k: 'ramp', a: [20, 90], b: [370, 170] },
      { k: 'spinner', p: [450, 260], len: 150, speed: 0.03 },
      { k: 'seesaw', p: [300, 450], len: 280 },
      { k: 'ramp', a: [0, 530], b: [240, 610] }, { k: 'ramp', a: [600, 530], b: [360, 610] },
      { k: 'bell', p: [250, 690], r: 14 }, { k: 'bell', p: [350, 690], r: 14 },
    ],
  },
  {
    name: 'Grand Run', parts: 'A bit of everything',
    start: [60, 35],
    pieces: [
      { k: 'tower', x: 140, y1: 400, y2: 900 }, { k: 'tower', x: 300, y1: 650, y2: 900 }, { k: 'tower', x: 480, y1: 160, y2: 520 },
      { k: 'ramp', a: [30, 80], b: [480, 160] }, { k: 'turn', c: [480, 175], r: 60, side: 'R' },
      { k: 'ramp', a: [480, 235], b: [170, 300] },
      { k: 'spinner', p: [140, 400], len: 140, speed: 0.034 },
      { k: 'bell', p: [330, 420], r: 14 }, { k: 'bell', p: [450, 380], r: 14 }, { k: 'bell', p: [540, 455], r: 14 },
      { k: 'ramp', a: [0, 520], b: [240, 580] }, { k: 'ramp', a: [600, 520], b: [360, 580] },
      { k: 'seesaw', p: [300, 650], len: 240 },
    ],
  },
];

// ================= Physics simulation of one built track =================
class Sim {
  constructor(def, gravity) {
    this.def = def;
    this.engine = Engine.create();
    this.engine.positionIterations = 8;
    this.engine.velocityIterations = 6;
    this.engine.gravity.y = gravity;
    this.world = this.engine.world;
    this.items = [];
    this.marbles = [];
    this.onHit = null;
    let ci = 0;
    // invisible side walls + the finish funnel and tray every track shares
    this.plank(-30, -2500, -30, H + 60, 'wall', 60);
    this.plank(W + 30, -2500, W + 30, H + 60, 'wall', 60);
    for (const p of def.pieces) {
      if (p.k === 'ramp') this.plank(p.a[0], p.a[1], p.b[0], p.b[1], 'ramp', T, ci++);
      else if (p.k === 'stop') this.plank(p.a[0], p.a[1], p.b[0], p.b[1], 'stop', 10, ci++);
      else if (p.k === 'turn') this.turn(p, ci++);
      else if (p.k === 'bell') this.bell(p);
      else if (p.k === 'spinner') this.spinner(p, ci++);
      else if (p.k === 'seesaw') this.seesaw(p, ci++);
      else this.items.push({ ...p });
    }
    this.plank(0, 740, TRAY.x1, TRAY.top, 'funnel', T);
    this.plank(W, 740, TRAY.x2, TRAY.top, 'funnel', T);
    this.plank(TRAY.x1, TRAY.top, TRAY.x1, TRAY.floor, 'tray', 10);
    this.plank(TRAY.x2, TRAY.top, TRAY.x2, TRAY.floor, 'tray', 10);
    this.plank(TRAY.x1, TRAY.floor, TRAY.x2, TRAY.floor, 'tray', 10);
    this.items.push({ k: 'start', x: def.start[0], y: def.start[1] });

    Events.on(this.engine, 'collisionStart', ev => {
      if (!this.onHit) return;
      for (const pair of ev.pairs) {
        let a = pair.bodyA, b = pair.bodyB;
        if (a.label === 'marble') [a, b] = [b, a];
        if (b.label !== 'marble') continue;
        const root = a.parent || a;
        this.onHit(root.plugin && root.plugin.item, b);
      }
    });
  }
  body(b, item) { b.plugin = { item }; Composite.add(this.world, b); return b; }
  plank(x1, y1, x2, y2, role, t = T, ci = 0, draw = true) {
    const len = Math.hypot(x2 - x1, y2 - y1), ang = Math.atan2(y2 - y1, x2 - x1);
    const item = { k: 'plank', role, x1, y1, x2, y2, t, ci, draw };
    this.body(Bodies.rectangle((x1 + x2) / 2, (y1 + y2) / 2, len + t * 0.45, t, {
      isStatic: true, angle: ang, friction: 0.01, frictionStatic: 0, restitution: 0.25, label: role, chamfer: { radius: t / 2 - 1 },
    }), item);
    if (draw) this.items.push(item);
    return item;
  }
  turn(p, ci) {
    const [cx, cy] = p.c, r = p.r, a0 = p.side === 'R' ? -Math.PI / 2 : Math.PI / 2, n = 14;
    const item = { k: 'turn', cx, cy, r, a0, a1: a0 + Math.PI, ci };
    for (let i = 0; i < n; i++) {
      const u = a0 + Math.PI * i / n, v = a0 + Math.PI * (i + 1) / n;
      this.plank(cx + Math.cos(u) * r, cy + Math.sin(u) * r, cx + Math.cos(v) * r, cy + Math.sin(v) * r, 'turn', T, ci, false);
    }
    this.items.push(item);
  }
  bell(p) {
    const item = { k: 'bell', x: p.p[0], y: p.p[1], r: p.r, flash: 0, swing: 0, note: 0 };
    item.note = Math.max(0, Math.min(5, Math.floor(p.p[0] / 100)));
    this.body(Bodies.circle(p.p[0], p.p[1], p.r, { isStatic: true, restitution: 0.75, frictionStatic: 0, label: 'bell' }), item);
    this.items.push(item);
  }
  spinner(p, ci) {
    const [x, y] = p.p;
    const b = Body.create({
      parts: [Bodies.rectangle(x, y, p.len, 14, { chamfer: { radius: 6 } }), Bodies.rectangle(x, y, 14, p.len, { chamfer: { radius: 6 } })],
      isStatic: true, label: 'spinner', friction: 0.05, restitution: 0.3,
    });
    const item = { k: 'spinner', x, y, len: p.len, speed: p.speed, ci, b };
    this.body(b, item);
    this.items.push(item);
  }
  seesaw(p, ci) {
    const [x, y] = p.p, half = p.len / 2;
    const b = Bodies.rectangle(x, y, p.len, T, { density: 0.003, frictionAir: 0.04, friction: 0.01, label: 'seesaw', chamfer: { radius: 5 } });
    const item = { k: 'seesaw', x, y, len: p.len, ci, b };
    this.body(b, item);
    Composite.add(this.world, Constraint.create({ pointA: { x, y }, bodyB: b, pointB: { x: 0, y: 0 }, stiffness: 1, length: 0 }));
    // little stoppers under each end keep the tilt gentle
    [-1, 1].forEach(s => this.body(Bodies.circle(x + s * (half - 22), y + 32, 6, { isStatic: true, label: 'stopper' }), { k: 'stopper' }));
    this.items.push(item);
  }
  addMarble(x, y) {
    const b = Bodies.polygon(x, y, 32, R, { restitution: 0.45, friction: 0.002, frictionStatic: 0, frictionAir: 0.0012, density: 0.002, label: 'marble' });
    Body.setVelocity(b, { x: (Math.random() - 0.5) * 0.4, y: 0 });
    Composite.add(this.world, b);
    this.marbles.push(b);
    return b;
  }
  removeMarble(b) { Composite.remove(this.world, b); this.marbles = this.marbles.filter(m => m !== b); }
  inTray(b) { return b.position.y > TRAY.top + 4 && b.position.x > TRAY.x1 && b.position.x < TRAY.x2; }
  step() {
    for (const it of this.items) if (it.k === 'spinner') { Body.setAngle(it.b, it.b.angle + it.speed); Body.setAngularVelocity(it.b, it.speed); }
    Engine.update(this.engine, 1000 / 60);
  }
}

// Debug helper: run a track headlessly and count how many marbles reach the tray.
window.__marbleTest = (i, gravity = 1, n = MARBLES, steps = 3000) => {
  const s = new Sim(TRACKS[i], gravity);
  let dropped = 0;
  for (let k = 0; k < steps; k++) {
    if (k % 40 === 0 && dropped < n) { s.addMarble(TRACKS[i].start[0], TRACKS[i].start[1]); dropped++; }
    s.step();
  }
  const done = s.marbles.filter(b => s.inTray(b)).length;
  const stuck = s.marbles.filter(b => !s.inTray(b)).map(b => [Math.round(b.position.x), Math.round(b.position.y)]);
  return { track: TRACKS[i].name, gravity, done, of: n, stuck };
};

// ================= Game state =================
let theme = 'city';
try { const t = localStorage.getItem('marble-run-theme'); if (THEMES[t]) theme = t; } catch (e) {}

// ================= Sound =================
let actx = null, soundOn = true, lastTick = 0;
function audio() {
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }

function tone(freq, dur, type, vol, slideTo, delay = 0) {

  o.type = type; o.frequency.setValueAtTime(freq, t0);

  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol, t0 + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g).connect(actx.destination);
  o.start(t0); o.stop(t0 + dur + 0.02);
}
const sfx = {
  bell(n) {
    const f = THEMES[theme].notes[n % 6];
    if (theme === 'city') { tone(f * 2, 0.5, 'sine', 0.12); tone(f * 5.4, 0.25, 'sine', 0.03); }
    else if (theme === 'jungle') { tone(f, 0.35, 'sine', 0.18); tone(f * 4, 0.08, 'sine', 0.05); }
    else tone(f * 1.6, 0.35, 'sine', 0.12, f * 0.6);
  },
  tick(speed) {
    const now = performance.now(); if (now - lastTick < 70) return; lastTick = now;
    const v = Math.min(0.05, speed * 0.008);
    if (theme === 'city') tone(1800, 0.03, 'triangle', v);
    else if (theme === 'jungle') tone(320 + Math.random() * 80, 0.06, 'sine', v * 2);
    else tone(2400, 0.04, 'sine', v, 1600);
  },
  clack() { tone(theme === 'space' ? 300 : 180, 0.08, 'triangle', 0.08); },
  drop() { tone(600, 0.08, 'sine', 0.08, 1200); },
  pick() { tone(700, 0.07, 'sine', 0.09); tone(1050, 0.1, 'sine', 0.09, null, 0.06); },
  tray() { const n = THEMES[theme].notes; tone(n[0], 0.12, 'triangle', 0.08); tone(n[2], 0.16, 'triangle', 0.08, null, 0.07); },
  fanfare() { const n = THEMES[theme].notes; [0, 2, 4, 5, 4, 5].forEach((k, j) => tone(n[k], 0.2, 'triangle', 0.1, null, j * 0.11)); },
};

// ================= Canvas & view =================
const cv = document.getElementById('cv');
const mainCtx = cv.getContext('2d');
const field = document.getElementById('field');
let ctx = mainCtx;
let mainView = { s: 1, ox: 0, oy: 0, w: 0, h: 0, dpr: 1 };
let view = mainView;

function resize() {
  const r = field.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
  const pad = 6, s = Math.min((r.width - pad * 2) / W, (r.height - pad * 2) / H);
  Object.assign(mainView, { s, ox: (r.width - W * s) / 2, oy: (r.height - H * s) / 2, w: r.width, h: r.height, dpr });
}
new ResizeObserver(resize).observe(field);

function toWorld(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left - mainView.ox) / mainView.s, y: (e.clientY - r.top - mainView.oy) / mainView.s };

// ================= Scenery =================
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const scenery = (() => {
  const r = rng(42), buildings = [];
  let x = -700;
  while (x < W + 700) {
    const w = 50 + r() * 70, h = 160 + r() * 360, wins = [];
    for (let wy = H - h + 14; wy < H - 20; wy += 22) for (let wx = x + 8; wx < x + w - 12; wx += 16) wins.push([wx, wy, r() < 0.45]);
    buildings.push({ x, w, h, shade: r(), wins });
    x += w + 4 + r() * 10;
  }
  return {
    buildings,
    clouds: Array.from({ length: 7 }, () => ({ x: -600 + r() * 1800, y: 30 + r() * 260, s: 0.6 + r() * 0.9, v: 0.08 + r() * 0.15 })),
    leaves: Array.from({ length: 46 }, () => ({ x: -650 + r() * 1900, y: r() * H, rot: r() * 6.28, s: 0.6 + r() * 1.4, d: r() })),
    vines: Array.from({ length: 16 }, () => ({ x: -600 + r() * 1800, len: 120 + r() * 380, sway: r() * 6 })),
    stars: Array.from({ length: 260 }, () => ({ x: -700 + r() * 2000, y: -200 + r() * 1300, s: 0.5 + r() * 1.8, tw: r() * 6 })),

function roundRect(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, h, r) : ctx.rect(x, y, w, h); }

}

function drawBackground(t) {
  const th = THEMES[theme];

  g.addColorStop(0, th.sky[0]); g.addColorStop(0.55, th.sky[1]); g.addColorStop(1, th.sky[2]);
  ctx.fillStyle = g; ctx.fillRect(0, 0, view.w, view.h);
  ctx.save(); ctx.translate(view.ox, view.oy); ctx.scale(view.s, view.s);
  if (theme === 'city') {
    ctx.fillStyle = '#fff4c2'; ctx.beginPath(); ctx.arc(500, 110, 46, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.85)';
    for (const c of scenery.clouds) {
      const cx = ((c.x + t * c.v * 0.02) % 2000 + 2000) % 2000 - 700;
      ctx.beginPath();
      ctx.ellipse(cx, c.y, 50 * c.s, 18 * c.s, 0, 0, 7);
      ctx.ellipse(cx + 26 * c.s, c.y - 12 * c.s, 30 * c.s, 20 * c.s, 0, 0, 7);
      ctx.ellipse(cx - 22 * c.s, c.y - 8 * c.s, 26 * c.s, 16 * c.s, 0, 0, 7);
      ctx.fill();
    }
    for (const b of scenery.buildings) {
      ctx.fillStyle = `hsl(${220 + b.shade * 30} 30% ${62 + b.shade * 14}%)`;
      ctx.fillRect(b.x, H - b.h, b.w, b.h + 200);
      for (const [wx, wy, on] of b.wins) { ctx.fillStyle = on ? 'rgba(255,230,140,.8)' : 'rgba(40,50,90,.2)'; ctx.fillRect(wx, wy, 8, 11); }
    }

    ctx.fillStyle = 'rgba(255,255,200,.08)';
    for (let i = 0; i < 5; i++) { ctx.beginPath(); ctx.moveTo(80 + i * 120, -100); ctx.lineTo(140 + i * 120, -100); ctx.lineTo(40 + i * 140, H); ctx.lineTo(-20 + i * 140, H); ctx.fill(); }
    for (const lf of scenery.leaves) {
      ctx.save(); ctx.translate(lf.x, lf.y); ctx.rotate(lf.rot + Math.sin(t / 1500 + lf.d * 6) * 0.05); ctx.scale(lf.s, lf.s);
      ctx.fillStyle = lf.d < 0.5 ? 'rgba(20,80,40,.5)' : 'rgba(60,140,70,.4)';
      ctx.beginPath(); ctx.ellipse(0, 0, 60, 22, 0, 0, 7); ctx.fill();
      ctx.restore();

      ctx.strokeStyle = 'rgba(45,106,47,.8)'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.moveTo(v.x, -300); ctx.quadraticCurveTo(v.x + sw * 2, v.len / 2 - 150, v.x + sw, v.len); ctx.stroke();

}

// ================= Piece drawing =================
const pieceColor = ci => THEMES[theme].pieces[ci % THEMES[theme].pieces.length];

// One chunky toy beam, centred at (cx,cy), length L, thickness t, angle ang.
function drawBeam(cx, cy, L, t, ang, col, variant = 0) {
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(ang);
  const x = -L / 2, y = -t / 2;
  if (theme === 'space') {
    ctx.shadowColor = col; ctx.shadowBlur = 12;
    roundRect(x, y, L, t, t / 2); ctx.fillStyle = '#121848'; ctx.fill();
    ctx.shadowBlur = 0; ctx.lineWidth = 2.5; ctx.strokeStyle = col; ctx.stroke();
    ctx.fillStyle = col; ctx.globalAlpha = 0.5;
    for (let dx = x + 14; dx < x + L - 8; dx += 22) { ctx.beginPath(); ctx.arc(dx, 0, 1.6, 0, 7); ctx.fill(); }
  } else if (theme === 'jungle') {
    const bamboo = variant % 2 === 1;
    roundRect(x, y, L, t, t / 2); ctx.fillStyle = col; ctx.fill();
    ctx.save(); roundRect(x, y, L, t, t / 2); ctx.clip();
    if (bamboo) {
      ctx.fillStyle = shade(col, -0.35);
      for (let nx = x + 26; nx < x + L - 8; nx += 34) ctx.fillRect(nx, y, 3, t);
    } else {
      ctx.strokeStyle = 'rgba(60,30,10,.4)'; ctx.lineWidth = 1.2;
      const r = rng(variant * 977 + Math.round(L));
      for (let i = 0; i < L / 30; i++) { const gx = x + r() * L, gy = y + 3 + r() * (t - 6); ctx.beginPath(); ctx.moveTo(gx, gy); ctx.lineTo(gx + 18 + r() * 26, gy); ctx.stroke(); }
    }
    ctx.fillStyle = 'rgba(255,240,200,.28)'; ctx.fillRect(x, y, L, t * 0.32);
    ctx.restore();
    roundRect(x, y, L, t, t / 2); ctx.lineWidth = 2; ctx.strokeStyle = shade(col, -0.55); ctx.stroke();
  } else {
    roundRect(x, y, L, t, t / 2); ctx.fillStyle = col; ctx.fill();
    ctx.save(); roundRect(x, y, L, t, t / 2); ctx.clip();
    ctx.fillStyle = 'rgba(255,255,255,.38)'; ctx.fillRect(x, y, L, t * 0.32);
    ctx.fillStyle = 'rgba(0,0,0,.16)'; ctx.fillRect(x, y + t * 0.7, L, t * 0.3);
    ctx.restore();
    roundRect(x, y, L, t, t / 2); ctx.lineWidth = 2; ctx.strokeStyle = shade(col, -0.5); ctx.stroke();

function drawJoint(x, y, col) {
  if (theme === 'city') {
    const c = shade(col, -0.15);
    roundRect(x - 10, y - 10, 20, 20, 4); ctx.fillStyle = c; ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = shade(col, -0.5); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,.45)'; ctx.beginPath(); ctx.arc(x, y, 4.5, 0, 7); ctx.fill();
  } else if (theme === 'jungle') {
    ctx.strokeStyle = '#e8c58a'; ctx.lineWidth = 3; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x - 7, y - 8); ctx.lineTo(x + 7, y + 8); ctx.moveTo(x + 7, y - 8); ctx.lineTo(x - 7, y + 8); ctx.stroke();
  } else {
    ctx.shadowColor = col; ctx.shadowBlur = 10; ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(x, y, 5, 0, 7); ctx.fill(); ctx.shadowBlur = 0;
  }

function drawTower(it) {
  const col = THEMES[theme].tower, x = it.x;
  if (theme === 'city') {
    for (let y = it.y1; y < it.y2; y += 44) {
      const h = Math.min(42, it.y2 - y);
      roundRect(x - 13, y, 26, h, 4); ctx.fillStyle = (Math.round((y - it.y1) / 44) % 2) ? '#d9dde6' : col; ctx.fill();
      ctx.lineWidth = 2; ctx.strokeStyle = '#8f96a6'; ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.beginPath(); ctx.arc(x, y + 10, 4, 0, 7); ctx.fill();
    }
  } else if (theme === 'jungle') {
    ctx.fillStyle = col; ctx.fillRect(x - 7, it.y1, 14, it.y2 - it.y1);
    ctx.fillStyle = shade(col, -0.35);
    for (let y = it.y1 + 30; y < it.y2; y += 46) ctx.fillRect(x - 8, y, 16, 3);
    ctx.fillStyle = 'rgba(255,255,255,.2)'; ctx.fillRect(x - 5, it.y1, 3, it.y2 - it.y1);
  } else {
    ctx.strokeStyle = col; ctx.globalAlpha = 0.7; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x - 9, it.y1); ctx.lineTo(x - 9, it.y2); ctx.moveTo(x + 9, it.y1); ctx.lineTo(x + 9, it.y2);
    for (let y = it.y1, s = -1; y < it.y2; y += 18, s = -s) { ctx.moveTo(x - 9 * s, y); ctx.lineTo(x + 9 * s, y + 18); }

function drawBoard(it) {
  const w = it.x2 - it.x1, h = it.y2 - it.y1;
  roundRect(it.x1, it.y1, w, h, 18);
  ctx.fillStyle = theme === 'city' ? 'rgba(255,255,255,.55)' : theme === 'jungle' ? 'rgba(120,80,40,.35)' : 'rgba(40,30,110,.55)';
  ctx.fill();
  ctx.lineWidth = 4; ctx.strokeStyle = theme === 'space' ? '#5a6cff' : theme === 'jungle' ? '#6d4c2f' : '#c9ced8'; ctx.stroke();
  ctx.fillStyle = theme === 'space' ? 'rgba(120,140,255,.25)' : 'rgba(0,0,0,.12)';

function drawPlankItem(it) {

function drawTurn(it) {
  const col = pieceColor(it.ci);

function drawBell(it) {

  ctx.save(); ctx.translate(it.x, it.y); ctx.scale(s, s);

    ctx.rotate(Math.sin(performance.now() / 60) * it.swing * 0.5);

function drawSpinner(it) {
  const col = pieceColor(it.ci), a = it.b.angle;
  drawBeam(it.x, it.y, it.len, 14, a, col, 1);
  drawBeam(it.x, it.y, it.len, 14, a + Math.PI / 2, col, 1);
  ctx.fillStyle = theme === 'space' ? '#ffd166' : theme === 'jungle' ? '#6b4320' : '#2b2b2b';
  ctx.beginPath(); ctx.arc(it.x, it.y, 11, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.beginPath(); ctx.arc(it.x - 3, it.y - 3, 3.5, 0, 7); ctx.fill();
}

function drawSeesaw(it) {
  const col = pieceColor(it.ci);
  ctx.fillStyle = theme === 'space' ? '#2a2f7a' : theme === 'jungle' ? '#6d4c2f' : '#5c6478';
  ctx.beginPath(); ctx.moveTo(it.x, it.y); ctx.lineTo(it.x - 20, it.y + 34); ctx.lineTo(it.x + 20, it.y + 34); ctx.closePath(); ctx.fill();

  drawBeam(it.b.position.x, it.b.position.y, it.len, T, it.b.angle, col, 0);
  drawJoint(it.b.position.x, it.b.position.y, col);

function drawStart(it, t) {

  ctx.save(); ctx.translate(it.x, it.y);
  ctx.beginPath(); ctx.moveTo(-34, -30); ctx.lineTo(34, -30); ctx.lineTo(16, 4); ctx.lineTo(-16, 4); ctx.closePath();
  ctx.fillStyle = theme === 'space' ? 'rgba(179,136,255,.25)' : 'rgba(255,255,255,.7)'; ctx.fill();

function drawTrayLabel() {
  const n = sim ? sim.marbles.filter(b => marbleInfo.get(b)?.inTray).length : 0;
  ctx.save();
  ctx.fillStyle = theme === 'space' ? 'rgba(179,136,255,.18)' : 'rgba(255,255,255,.35)';
  ctx.fillRect(TRAY.x1, TRAY.top, TRAY.x2 - TRAY.x1, TRAY.floor - TRAY.top);

  ctx.fillText('FINISH', (TRAY.x1 + TRAY.x2) / 2, TRAY.top - 10);
  ctx.restore();
  return n;
}

function drawMarble(b) {
  const m = marbleInfo.get(b); if (!m) return;
  const { x, y } = b.position, a = b.angle;
  m.scale = Math.min(1, m.scale + 0.12);
  ctx.save(); ctx.translate(x, y); ctx.scale(m.scale, m.scale);
  if (theme === 'space') { ctx.shadowColor = m.color; ctx.shadowBlur = 10; }
  ctx.fillStyle = m.color; ctx.beginPath(); ctx.arc(0, 0, R, 0, 7); ctx.fill();
  ctx.shadowBlur = 0;
  ctx.save(); ctx.rotate(a);
  if (theme === 'city') {
    ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.arc(0, 0, R * 0.55, 0.3, 2.4); ctx.stroke();
  } else if (theme === 'jungle') {
    ctx.fillStyle = '#5a3a1a'; ctx.fillRect(-1, -R - 3, 2, 5);
    ctx.fillStyle = '#3fae49'; ctx.beginPath(); ctx.ellipse(5, -R - 1, 6, 3, -0.4, 0, 7); ctx.fill();
  } else {
    ctx.save(); ctx.beginPath(); ctx.arc(0, 0, R, 0, 7); ctx.clip();
    ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fillRect(-R, -3 + (m.seed - 0.5) * 8, R * 2, 4);
    ctx.fillStyle = 'rgba(0,0,0,.2)'; ctx.fillRect(-R, 4 + (m.seed - 0.5) * 4, R * 2, 3);
    ctx.restore();
  }
  ctx.restore();
  const g = ctx.createRadialGradient(-R * 0.4, -R * 0.45, 1, 0, 0, R);
  g.addColorStop(0, 'rgba(255,255,255,.75)'); g.addColorStop(0.35, 'rgba(255,255,255,0)'); g.addColorStop(1, 'rgba(0,0,0,.28)');
  ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, 0, R, 0, 7); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.25)'; ctx.lineWidth = 1; ctx.stroke();
  ctx.restore();
}

function drawParticles() {
  for (const p of particles) {
    ctx.save(); ctx.globalAlpha = Math.max(0, p.life); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.fillStyle = p.color;
    if (theme === 'jungle') { ctx.beginPath(); ctx.ellipse(0, 0, p.size, p.size * 0.45, 0, 0, 7); ctx.fill(); }
    else if (theme === 'space') { ctx.beginPath(); for (let k = 0; k < 8; k++) { const rr = k % 2 ? p.size * 0.35 : p.size; ctx.lineTo(Math.cos(k * Math.PI / 4) * rr, Math.sin(k * Math.PI / 4) * rr); } ctx.fill(); }
    else ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
    ctx.restore();
  }
  for (const pt of popTexts) {
    ctx.save(); ctx.globalAlpha = Math.max(0, Math.min(1, pt.life));
    ctx.font = '800 48px "Baloo 2", system-ui, sans-serif'; ctx.textAlign = 'center';
    ctx.lineWidth = 7; ctx.strokeStyle = 'rgba(0,0,0,.4)'; ctx.strokeText(pt.text, pt.x, pt.y);
    ctx.fillStyle = THEMES[theme].particle[0]; ctx.fillText(pt.text, pt.x, pt.y);
    ctx.restore();
  }
}

// Draw a whole track (used for the play field and the picker thumbnails).
function drawTrack(s, t, withMarbles) {
  const order = ['board', 'tower'];
  for (const k of order) for (const it of s.items) if (it.k === k) (k === 'board' ? drawBoard : drawTower)(it);
  if (withMarbles) drawTrayLabel(); else { ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fillRect(TRAY.x1, TRAY.top, TRAY.x2 - TRAY.x1, TRAY.floor - TRAY.top); }
  for (const it of s.items) {
    if (it.k === 'plank') drawPlankItem(it);
    else if (it.k === 'turn') drawTurn(it);
    else if (it.k === 'spinner') drawSpinner(it);
    else if (it.k === 'seesaw') drawSeesaw(it);
    else if (it.k === 'start') drawStart(it, t);
  }
  for (const it of s.items) if (it.k === 'bell') drawBell(it);
  if (withMarbles) s.marbles.forEach(drawMarble);
}

// ================= Particles =================
function burst(x, y, n, color) {
  const cols = THEMES[theme].particle;
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = 1 + Math.random() * 3.5;
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 1.5, life: 1, decay: 0.02 + Math.random() * 0.02,
      rot: Math.random() * 6, vr: (Math.random() - .5) * .3, size: 3 + Math.random() * 4,
      color: color && Math.random() < 0.4 ? color : cols[Math.floor(Math.random() * cols.length)] });
  }
}

// ================= Game actions =================
const $ = id => document.getElementById(id);
const hint = $('hint');

function loadTrack(i) {
  trackIdx = i;
  sim = new Sim(TRACKS[i], THEMES[theme].gravity);
  sim.onHit = (item, mb) => {
    const sp = Math.hypot(mb.velocity.x, mb.velocity.y);
    if (item && item.k === 'bell') { item.flash = 1; item.swing = 1; sfx.bell(item.note); burst(mb.position.x, mb.position.y, 4); }
    else if (item && item.k === 'seesaw') { if (sp > 1.5) sfx.clack(); }
    else if (sp > 2.5) sfx.tick(sp);
  };
  marbleInfo = new Map(); particles = []; popTexts = [];
  pouch = MARBLES; queue = 0; celebrated = false;
  $('track-name').textContent = TRACKS[i].name;
  $('picker').hidden = true;
  updateUI();
}

function showPicker() {
  $('picker').hidden = false;
  $('track-name').textContent = 'Pick a track';
  renderThumbs();
  updateUI();
}

function spawnFromStart() {
  const [sx, sy] = sim.def.start;
  if (sim.marbles.some(b => Math.hypot(b.position.x - sx, b.position.y - sy) < 2 * R + 4)) return false;
  const b = sim.addMarble(sx + (Math.random() - 0.5) * 4, sy);
  const cols = THEMES[theme].marbles;
  const used = MARBLES - pouch - queue;
  marbleInfo.set(b, { color: cols[(used + sim.marbles.length) % cols.length], seed: Math.random(), scale: 0.2, inTray: false });
  sfx.drop();
  return true;
}
function dropOne() { if (!sim || pouch <= 0) return; pouch--; queue++; celebrated = false; updateUI(); }
function dropAll() { if (!sim || pouch <= 0) return; queue += pouch; pouch = 0; celebrated = false; updateUI(); }
function pickMarble(b) {
  burst(b.position.x, b.position.y, 8, marbleInfo.get(b)?.color);
  sim.removeMarble(b); marbleInfo.delete(b);
  pouch++; sfx.pick(); updateUI();
}
function pickAll() {
  if (!sim) return;
  [...sim.marbles].forEach((b, i) => setTimeout(() => { if (sim && sim.marbles.includes(b)) pickMarble(b); }, i * 70));
}

function updateUI() {
  const playing = !!sim && $('picker').hidden;
  $('pouch-dots').innerHTML = Array.from({ length: MARBLES }, (_, i) => `<i class="${i < pouch ? '' : 'out'}"></i>`).join('');
  $('btn-drop').disabled = !playing || pouch === 0;
  $('btn-all').disabled = !playing || pouch === 0;
  $('btn-pick').disabled = !playing || sim.marbles.length === 0;
  if (!playing) { hint.hidden = true; return; }
  hint.hidden = false;
  const inTray = sim.marbles.filter(b => marbleInfo.get(b)?.inTray).length;
  if (pouch === MARBLES) hint.textContent = 'Tap the track to drop a marble';
  else if (pouch === 0 && queue === 0 && inTray === sim.marbles.length) hint.textContent = 'Tap the marbles to pick them up';
  else if (pouch === 0) hint.textContent = 'All marbles are rolling!';
  else hint.textContent = `${pouch} marble${pouch === 1 ? '' : 's'} left in the bag`;
}

// ================= Input =================
cv.addEventListener('pointerdown', e => {
  audio();
  if (!sim || !$('picker').hidden) return;
  const w = toWorld(e), reach = R + 26 / mainView.s;
  let best = null, bd = Infinity;
  for (const b of sim.marbles) { const d = Math.hypot(b.position.x - w.x, b.position.y - w.y); if (d < reach && d < bd) { bd = d; best = b; } }
  if (best) pickMarble(best);
  else dropOne();
});
$('btn-drop').onclick = () => { audio(); dropOne(); };
$('btn-all').onclick = () => { audio(); dropAll(); };
$('btn-pick').onclick = () => { audio(); pickAll(); };
$('btn-tracks').onclick = () => { audio(); showPicker(); };
$('btn-sound').onclick = () => {
  soundOn = !soundOn; audio();
  $('btn-sound').setAttribute('aria-pressed', soundOn);
  $('snd-waves').style.opacity = soundOn ? 1 : 0.2;
  $('sound-lbl').textContent = soundOn ? 'Sound' : 'Quiet';
};

function setTheme(t) {
  theme = t;
  document.body.dataset.world = t;
  document.querySelectorAll('[data-theme-btn]').forEach(b => b.setAttribute('aria-pressed', b.dataset.themeBtn === t));
  if (sim) sim.engine.gravity.y = THEMES[t].gravity;
  const cols = THEMES[t].marbles;
  let i = 0; marbleInfo.forEach(m => { m.color = cols[i++ % cols.length]; });
  try { localStorage.setItem('marble-run-theme', t); } catch (e) {}
  if (!$('picker').hidden) renderThumbs();
}
document.querySelectorAll('[data-theme-btn]').forEach(b => b.onclick = () => { audio(); setTheme(b.dataset.themeBtn); sfx.tray(); });

// ================= Track picker =================
const thumbSims = TRACKS.map(d => new Sim(d, 1));
function buildCards() {
  $('cards').innerHTML = TRACKS.map((d, i) => `
    <button class="card" data-track="${i}" id="card-${i}">
      <canvas width="300" height="450" aria-hidden="true"></canvas>
      <span class="name">${i + 1}. ${d.name}</span>
      <span class="parts">${d.parts}</span>
    </button>`).join('');
  $('cards').querySelectorAll('.card').forEach(c => c.onclick = () => { audio(); sfx.tray(); loadTrack(+c.dataset.track); });
}
function renderThumbs() {
  $('cards').querySelectorAll('.card').forEach((card, i) => {
    const c = card.querySelector('canvas');
    const saveCtx = ctx, saveView = view;
    ctx = c.getContext('2d');
    view = { s: c.width / W, ox: 0, oy: 0, w: c.width, h: c.height, dpr: 1 };
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    drawBackground(0);
    ctx.save(); ctx.scale(view.s, view.s); drawTrack(thumbSims[i], 0, false); ctx.restore();
    ctx = saveCtx; view = saveView;
  });
}

// ================= Loop =================
const STEP = 1000 / 60;
let acc = 0, last = performance.now();
function step() {
  if (!sim) return;
  if (queue > 0 && spawnFromStart()) { queue--; updateUI(); }
  sim.step();
  let changed = false;
  for (const b of [...sim.marbles]) {
    const m = marbleInfo.get(b), p = b.position;
    if (p.y > H + 150 || p.x < -80 || p.x > W + 80) { sim.removeMarble(b); marbleInfo.delete(b); pouch++; changed = true; continue; }
    const inT = sim.inTray(b);
    if (m && inT && !m.inTray) { m.inTray = true; sfx.tray(); burst(p.x, p.y, 5, m.color); changed = true; }
    else if (m && !inT && m.inTray) m.inTray = false;
  }
  const inTray = sim.marbles.filter(b => marbleInfo.get(b)?.inTray).length;
  if (!celebrated && inTray === MARBLES) {
    celebrated = true; sfx.fanfare();
    burst(300, 760, 40); popTexts.push({ text: 'All 10!', x: 300, y: 700, life: 2 });
  }
  for (const p of particles) { p.x += p.vx; p.y += p.vy; p.vy += 0.12; p.rot += p.vr; p.life -= p.decay; }
  particles = particles.filter(p => p.life > 0);
  for (const pt of popTexts) { pt.y -= 0.8; pt.life -= 0.012; }
  popTexts = popTexts.filter(p => p.life > 0);
  if (changed) updateUI();
}
function render(t) {
  ctx.setTransform(mainView.dpr, 0, 0, mainView.dpr, 0, 0);
  drawBackground(t);
  if (!sim) return;
  ctx.save(); ctx.translate(mainView.ox, mainView.oy); ctx.scale(mainView.s, mainView.s);
  drawTrack(sim, t, true);
  drawParticles();
  ctx.restore();
}
function frame(now) {
  acc += Math.min(100, now - last); last = now;
  while (acc >= STEP) { step(); acc -= STEP; }
  render(now);
  requestAnimationFrame(frame);
}

function start(data) {
  buildCards();
  setTheme(data && THEMES[data.theme] ? data.theme : theme);
  if (data && Number.isInteger(data.track) && data.track >= 0 && TRACKS[data.track]) loadTrack(data.track);
  else showPicker();
  if (document.fonts) document.fonts.ready.then(() => { if (!$('picker').hidden) renderThumbs(); });
  requestAnimationFrame(frame);
}
window.claude?.hot?.snapshot?.(() => ({ theme, track: $('picker').hidden ? trackIdx : -1 }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
<script src="../assets/nav.js"></script>
</html>
